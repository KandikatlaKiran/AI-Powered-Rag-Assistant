spring.application.name=ChatbotUsingRAG

server.port=8080

# ===============================
# Ollama Configuration & Performance Tuning
# ===============================

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Keep model loaded in memory for 15 minutes between requests to eliminate cold start reloading overhead
spring.ai.ollama.chat.options.keep-alive=15m
# Grounded, focused temperature for accuracy
spring.ai.ollama.chat.options.temperature=0.2
# Bounded generation limit
spring.ai.ollama.chat.options.num-predict=512
# Context window size
spring.ai.ollama.chat.options.num-ctx=4096

# ===============================
# ChromaDB Configuration
# ===============================

spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.collection-name=rag_documents
spring.ai.vectorstore.chroma.initialize-schema=true

# ===============================
# File Upload Configuration
# ===============================

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Document Storage & Registry
# ===============================

app.documents.storage-path=./data/documents-registry.json

# ===============================
# RAG Configuration (Retrieval & Chunking)
# ===============================

# Number of candidate chunks to retrieve from ChromaDB (increased to cover multi-chapter docs)
app.rag.top-k=16

# Maximum total context length in characters to send to LLM (prevents context overflow)
# ~12000 chars ≈ ~3000 tokens — fits within llama3.2:3b's 4096-token context window
app.rag.max-context-characters=12000

# Soft similarity score floor (0.0–1.0). Chunks scoring below this are excluded as noise.
# 0.15 is intentionally permissive so Chapter 5 chunks are not dropped.
app.rag.similarity-threshold=0.15

# Target chunk size in tokens for document ingestion
app.rag.chunk-size=500

# Overlap size between adjacent chunks
app.rag.chunk-overlap=80

# ===============================
# CORS Configuration
# ===============================

# React frontend origin (Vite dev server)
app.cors.allowed-origin=http://localhost:5173